{% extends 'base.html' %}

{% block title %}Password Reset Complete - UFA Kenya{% endblock %}

{% block content %}
<div class="container py-5">
    <div class="row justify-content-center">
        <div class="col-md-6 col-lg-5">
            <div class="auth-card">
                <div class="card-header-custom" style="background: linear-gradient(135deg, var(--logo-green), var(--logo-blue));">
                    <h3><i class="fas fa-check-circle"></i> Password Reset Complete</h3>
                    <p>Your password has been successfully reset</p>
                </div>
                <div class="card-body-custom text-center">
                    <div style="font-size: 4rem; color: var(--logo-green); margin-bottom: 20px;">
                        <i class="fas fa-check-circle"></i>
                    </div>
                    <p class="mb-4">Your password has been set. You may go ahead and log in now.</p>
                    <a href="{% url 'login' %}" class="btn btn-primary-custom">
                        <i class="fas fa-sign-in-alt"></i> Log In
                    </a>
                </div>
            </div>
        </div>
    </div>
</div>
{% endblock %}
