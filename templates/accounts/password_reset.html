{% extends 'base.html' %}

{% block title %}Reset Password - UFA Kenya{% endblock %}

{% block content %}
<div class="container py-5">
    <div class="row justify-content-center">
        <div class="col-md-6 col-lg-5">
            <div class="auth-card">
                <div class="card-header-custom">
                    <h3><i class="fas fa-key"></i> Reset Password</h3>
                    <p>Enter your email to receive a password reset link</p>
                </div>
                <div class="card-body-custom">
                    <form method="post">
                        {% csrf_token %}
                        <div class="mb-3">
                            <label for="id_email" class="form-label-custom">
                                <i class="fas fa-envelope"></i> Email Address
                            </label>
                            <input type="email" name="email" id="id_email" class="form-control form-control-custom" placeholder="Enter your registered email" required>
                        </div>
                        <button type="submit" class="btn btn-primary-custom w-100">
                            <i class="fas fa-paper-plane"></i> Send Reset Link
                        </button>
                    </form>
                    <div class="text-center mt-3">
                        <a href="{% url 'login' %}" class="text-muted text-decoration-none">
                            <i class="fas fa-arrow-left"></i> Back to Login
                        </a>
                    </div>
                </div>
            </div>
        </div>
    </div>
</div>
{% endblock %}
